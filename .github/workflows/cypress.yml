name: Cypress E2E Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. Install dependencies & cache
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # 2. Run Cypress tests
  cypress-run:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Restore Cypress cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # Agar tidak install ulang karena sudah ada di job 'install'
          install: false 
        env:
          allure: true
        # PENTING: Jangan gunakan continue-on-error di sini jika ingin job 
        # ini tetap berstatus 'failed' tapi job selanjutnya tetap jalan.
        # Kita akan mengandalkan 'if: always()' di job berikutnya.
        continue-on-error: true 

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: cypress/results
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: always() # Diubah jadi always agar jika ada fail tetap terupload
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

  # 3. Generate Mochawesome report
  generate-report:
    runs-on: ubuntu-latest
    needs: cypress-run
    if: always() # Memastikan job jalan meski cypress-run fail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: cypress-results
          path: cypress/results

      - name: Merge Mochawesome reports
        run: npm run merge:reports || true # Tambahkan || true agar tidak stop jika script error

      - name: Generate Mochawesome HTML report
        run: npm run generate:html || true

      - name: Upload Mochawesome report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports
          if-no-files-found: ignore

  # 4. Generate Allure Report & Deploy
  generate-allure-report:
    runs-on: ubuntu-latest
    needs: cypress-run
    if: always() # Memastikan job jalan meski cypress-run fail
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4